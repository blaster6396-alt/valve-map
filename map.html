function fit(){if(!map)return;const b=new kakao.maps.LatLngBounds();for(const v of valves)b.extend(new kakao.maps.LatLng(v.lat,v.lng));map.setBounds(b)}
function savedLinks(id){try{return JSON.parse(localStorage.getItem('photos_'+id)||'[]')}catch{return []}}
function select(v){selected=v;$('title').textContent=v.number+'번 · '+v.id;overlays.forEach(o=>o.pin.classList.toggle('active',o.pin.title===v.number+'번 '+v.id));if(map){map.panTo(new kakao.maps.LatLng(v.lat,v.lng));map.setLevel(3)}$('status').textContent='위도 '+v.lat+' / 경도 '+v.lng;const box=$('content');box.replaceChildren();const actions=el('div');actions.className='row';const nav=el('button','현재 위치에서 길찾기');nav.className='primary';nav.onclick=()=>navigate(v);actions.append(nav);const road=el('button','로드뷰');road.onclick=()=>roadview(v);actions.append(road);box.append(actions);const dl=el('dl');for(const [k,value] of Object.entries(v.details)){dl.append(el('dt',k),el('dd',value||'—'))}box.append(dl);box.append(el('h2','밸브 사진'));const desc=el('p','사진 주소를 넣으면 이 기기에서 해당 밸브를 눌렀을 때 열립니다. 여러 장은 한 줄에 하나씩 넣으세요.');desc.className='note';box.append(desc);const input=el('textarea');input.style='width:100%;min-height:78px;border:1px solid #bac9d9;border-radius:8px;padding:8px';input.value=savedLinks(v.id).join('\n');input.placeholder='구글 드라이브 사진 공유 링크를 한 줄에 하나씩 붙여 넣기';box.append(input);const save=el('button','사진 링크 저장');save.onclick=()=>{const lines=input.value.split(/\n/).map(s=>s.trim()).filter(Boolean);if(lines.some(s=>{try{return !['https:'].includes(new URL(s).protocol)}catch{return true}})){alert('https:// 로 시작하는 사진 링크만 입력해 주세요.');return}localStorage.setItem('photos_'+v.id,JSON.stringify(lines));select(v)};box.append(save);const photos=el('div');for(const link of savedLinks(v.id)){let url;try{url=new URL(link)}catch{continue}const a=el('a','사진 열기 ↗');a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';photos.append(el('p')).append(a);if(url.hostname==='drive.google.com'){const match=url.pathname.match(/\/file\/d\/([^/]+)/);if(match){const frame=document.createElement('iframe');frame.title=v.id+' 사진 미리보기';frame.src='https://drive.google.com/file/d/'+encodeURIComponent(match[1])+'/preview';frame.loading='lazy';photos.append(frame)}}}if(!photos.children.length){const p=el('p','등록된 사진이 없습니다.');p.className='note';photos.append(p)}box.append(photos)}
function navigate(v){if(!navigator.geolocation){alert('이 브라우저는 현재 위치를 지원하지 않습니다.');return}navigator.geolocation.getCurrentPosition(p=>{const sp=p.coords.latitude+','+p.coords.longitude;const ep=v.lat+','+v.lng;window.open('https://m.map.kakao.com/scheme/route?sp='+encodeURIComponent(sp)+'&ep='+encodeURIComponent(ep)+'&by=foot','_blank','noopener')},e=>alert('현재 위치를 받을 수 없습니다. 휴대폰 위치 권한과 HTTPS 연결을 확인하세요.'),{enableHighAccuracy:true,timeout:12000})}
function roadview(v){if(!rvClient)return;const box=$('content');let wrap=$('roadview');if(wrap)wrap.remove();wrap=el('div');wrap.id='roadview';wrap.style='width:100%;height:300px;margin:15px 0';box.insertBefore(wrap,box.firstChild.nextSibling);const pos=new kakao.maps.LatLng(v.lat,v.lng);rvClient.getNearestPanoId(pos,100,id=>{if(selected!==v)return;if(!id){wrap.textContent='이 위치 가까이에 로드뷰가 없습니다.';return}rv=new kakao.maps.Roadview(wrap);rv.setPanoId(id,pos)})}
for(const v of valves){const b=el('button',String(v.number));b.className='tiny';b.title=v.id;b.onclick=()=>select(v);$('list').append(b)}load();</script></html>
